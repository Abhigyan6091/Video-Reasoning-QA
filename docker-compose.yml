version: "3.9"

services:
  app:
    build: .
    container_name: video-question-generator
    ports:
      - "9005:9005"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./frames:/app/frames
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
